<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#4fb3ff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="Zajko Utekajko – zbieraj mrkvičky a uteč kombajnu! Hra pre deti." />
    <title>Zajko Utekajko</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐰</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #2f6b2a;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #4fb3ff;
        color: #fff;
        font: 700 28px "Fredoka", sans-serif;
        text-align: center;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        text-shadow: 0 3px 0 #3b2412;
      }
      #rotate span { font-size: 80px; display: block; margin-bottom: 16px; }
      @media (orientation: portrait) and (max-width: 700px) {
        #rotate { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"><div><span>📱↻</span>Otoč telefón na šírku</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
